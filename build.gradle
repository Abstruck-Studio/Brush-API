// ============================================================================================
// Brush API —— 能力库 mod（导出副本，2026-10-15；自举/自包含改造 2026-10-16；JitPack 依赖化 2026-10-16）
//
// 独立项目：只含库模组源码、构建脚本与 `libs/` 下的回退 jar（不含 docs、不含 MC 二进制资产、不含 run/ 产物）。
//
// 编译期需要四类东西：
//   ① MC（vanilla jar + MC 自带库坐标）        ② Mixin / MixinExtras 注解
//   ③ NeoForge API（S3 载荷转注册桥要用）       ④ **加载器核心**（BrushNetwork / HostSeams / Dispatcher…）
//
// ★ 加载器核心的来源（2026-10-16 用户要求改为 JitPack 为主）：
//   默认：com.github.Abstruck-Studio:Brush:26.10.1         ← 主 jar（implementation）
//         com.github.Abstruck-Studio:Brush:<版本>:tools    ← 宿主 harness（Fabric/NeoForge）
//   回退：-Pbrush.useLocalJars=true → 用随项目分发的 libs/Brush-*.jar 与 libs/brush-tools.jar（离线/自包含）
//   版本：-Pbrush.jitpackVersion=<tag|branch|commit>，默认 test1
//   解析是惰性的：`gradlew help` / `tasks` 不会去联网，只有编译或运行才解析。
//
// ★ 新设备：本项目**自己就能自举，不需要任何兄弟项目** ——
//     gradlew.bat jar            自动补齐 MC 客户端 jar 并产出 build/libs/brush-api.jar（构建即自举）
//     gradlew.bat bootstrap      可选的一次性备齐：MC 客户端 jar + 库 + natives + assets
//     gradlew.bat runClient      跑 S1（run/ 在本项目内）；S2/S3 用 runFabricClient / runNeoForgeClient，
//                                S3 首次先 installNeoForge —— 三者都用上面那个 tools jars 里的 harness
//   ⇒ 把整个文件夹拷到别的设备也能跑（首次需联网；S3 首次需装宿主产物）。
//
// ★ 路径落点（2026-10-16 修订：**用户级 Gradle 缓存**，与 Fabric Loom / NeoForge neoform 同款）：
//   vanilla jar  ① -Pbrush.vanillaJar=  ② <gradle 用户目录>/caches/brush/<mcVersion>/<mcVersion>.jar
//   MC 缓存      ① -Pbrush.cache=       ② <gradle 用户目录>/caches/brush/cache
//   加载器 jar    ① -PbrushCoreJar=（仅本地模式）② JitPack 坐标 ③ libs/Brush-*.jar（本地模式）
//   要放到别处（项目内、共享盘…）就显式传属性。
//
// ★ 与 ../Brush 的关系（可选）：加载器 jar 由那边 `gradlew jar` 产出、`toolsJar` 产出宿主工具 jar；
//   可以发布到 JitPack 让本项目直接依赖，也可以各拷一份进 `libs/`。契约 jar 的产出仍在加载器项目侧
//   （它会自动发现本项目的 build/libs/brush-api.jar，也可用 -PbrushApiJar= 显式指过来）。
// ============================================================================================

plugins {
    id 'java'
}

group = 'org.abstruck.brush'
// 库模组版本单一来源：gradle.properties 的 apiVersion（与 src/main/resources/brush.mod.json 的 "version" 对齐）
version = project.findProperty('apiVersion') ?: '1.0.0'
def mcVersion = project.findProperty('mcVersion') ?: '26.1.2'
def projectDirPath = project.layout.projectDirectory.asFile.toPath()

// vanilla jar 落点（2026-10-16 修订：**默认放用户级 Gradle 缓存**，与 Fabric Loom / NeoForge
// neoform 同款做法 —— 项目根不再出现 26.1.2/ 与 cache/，多项目共享同一份；想放别处传属性）
// 另：2026-10-16 用户报"Brush API 不能自己下载 MC 本体" —— 根因是旧版把旁边的加载器项目也放进
// 候选链，本机一旦存在就直接借用、永不下载。现在默认只认这一处（自己的或共享的用户级缓存），
// 需要复用别的已有目录就显式传 -Pbrush.vanillaJar= / -Pbrush.cache=。
def brushCacheRoot = new File(gradle.gradleUserHomeDir, 'caches/brush')
def vanillaCandidates = []
if (project.hasProperty('brush.vanillaJar')) {
    vanillaCandidates << (project.property('brush.vanillaJar') as String)
}
vanillaCandidates << new File(brushCacheRoot, "${mcVersion}/${mcVersion}.jar").absolutePath
// 2026-10-16：属性**无条件优先**（与导出加载器一致）—— 此前是"取第一个存在的候选"，
// 于是 -Pbrush.vanillaJar=<还不存在的路径> 会被静默忽略、回落到共享缓存里的那份，
// 既不符合直觉，也让"指定新落点后自动下载"这条路径测不出来。现在：传了就用它（缺则自动下载）。
// 属性（若传了）在列表里是**第 0 个**（见上方 if (hasProperty) 的追加顺序），没传则第 0 个就是默认值，
// 所以两种情形都取 [0] —— 2026-10-16 修正：此前写成 `hasProperty ? [0] : [1]`，
// 不传属性时列表只有 1 个元素，[1] 为 null → Path.of(null) 抛 NPE（构建直接失败）。
def vanillaJar = java.nio.file.Path.of(vanillaCandidates[0] as String)

// MC 缓存落点（同上：默认用户级 Gradle 缓存）
def cacheCandidates = []
if (project.hasProperty('brush.cache')) {
    cacheCandidates << (project.property('brush.cache') as String)
}
cacheCandidates << new File(brushCacheRoot, 'cache').absolutePath
def cacheDir = java.nio.file.Path.of(cacheCandidates[0] as String)

// 核心 jar 查找顺序（2026-10-16 新增 ③）：③ 就是 Brush 项目 `gradlew jar` 的默认落地位置
def coreJarCandidates = []
if (project.hasProperty('brushCoreJar')) {
    coreJarCandidates << project.file(project.property('brushCoreJar'))
}
coreJarCandidates.addAll(project.fileTree("$projectDir/libs") { include 'Brush-*.jar' }.files)
coreJarCandidates.addAll(project.fileTree("$projectDir/../Brush/build/libs") { include 'Brush-*.jar' }.files)
def coreJar = files(coreJarCandidates)
// 自包含运行要"具体那一个 jar"（注入栈与 --brush-jar 都按单文件传），故显式取第一个存在的候选 ——
// 候选里可能同时有 <本项目>/libs/Brush-*.jar 与 ../Brush/build/libs/Brush-*.jar。
def coreJarFile = coreJarCandidates.find { it.isFile() } ?: coreJarCandidates[0]

// ===== 加载器 jar 的来源（2026-10-16 用户要求改为 JitPack 为主）=====
//   默认：从 JitPack 取 com.github.Abstruck-Studio:Brush:<版本>（主 jar）与 :tools（宿主 harness）
//   回退：-Pbrush.useLocalJars=true → 用随项目分发的 libs/Brush-*.jar 与 libs/brush-tools.jar（离线/自包含）
//   版本：-Pbrush.jitpackVersion=<tag|branch|commit>，默认 test1
//   ★ 解析是**惰性**的：gradlew help / tasks 不会去联网；只有编译或运行才解析。
def jitpackVersion = project.findProperty('brush.jitpackVersion') ?: '26.10.1'
def useLocalJars = project.hasProperty('brush.useLocalJars') && project.property('brush.useLocalJars') != 'false'
def jitpackGroup = 'com.github.Abstruck-Studio:Brush'

configurations {
    // 这两个配置的用途是"拿到**具体那一个 jar 文件**"（--brush-jar= / harness classpath），
    // 所以必须 transitive = false —— 否则会把加载器 POM 里的传递依赖（gson/asm/mixin/log4j…）一起解析进来，
    // 让 singleFile 报 "Expected configuration ':brushLoaderCore' to contain exactly one file"（2026-10-16 实测）。
    // 编译用的传递依赖走上面的 compileOnly 坐标，不受影响。
    brushLoaderCore { canBeConsumed = false; canBeResolved = true; transitive = false }
    brushLoaderTools { canBeConsumed = false; canBeResolved = true; transitive = false }
}

// ★ 必须在上面三个 def **之后**再定义这两个闭包：Groovy 闭包体里若引用"稍后才声明的局部变量"，
//   会退化成对 owner（Project）的属性查找 —— 实测报错（2026-10-16）：
//     Could not get unknown property 'useLocalJars' for root project 'BrushAPI'
//   表现：jar / installNeoForge 正常，但 runClient / S2 / S3 一跑就失败（它们要 --brush-jar=<单文件>）。
// 运行时与注入栈要"具体那一个 jar"，所以这里给单文件路径；惰性求值，执行期才解析配置。
def coreJarPath = { (useLocalJars ? coreJarFile : configurations.brushLoaderCore.singleFile).absolutePath }

// 统一的"加载器本体 jar 集合"：本地模式 = libs/ 里的文件；JitPack 模式 = 解析出的依赖文件
def loaderCore = useLocalJars ? coreJar : configurations.brushLoaderCore

// NeoForge universal jar（S3 载荷转注册桥的编译期 API）：位于 NeoForge 安装产物的 maven 布局里
def universalJar = cacheDir.resolve("neoforge/install/libraries/net/neoforged/neoforge/"
        + "26.1.2.114/neoforge-26.1.2.114-universal.jar").toFile()

repositories {
    // repo1.maven.org 在本机经代理访问存在持续性 404（2026-10-08 实测），
    // 以可用的阿里云公共镜像优先；mavenCentral 单列保留为原始来源（上游 build.gradle 同款）。
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }
    mavenCentral()
    // JitPack（2026-10-16 用户要求）：加载器 jar 默认从这里取
    maven { url = uri('https://jitpack.io') }
    // sponge-mixin 的官方发布源（只承载 net.fabricmc:*）
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
        content {
            includeGroup 'net.fabricmc'
            // Fabric API 的各个模块是 net.fabricmc.fabric-api:*（精确 includeGroup 匹配不到），
            // 2026-10-16：S2 能力桥需要 fabric-transfer-api-v1 等模块的编译期坐标。
            includeGroup 'net.fabricmc.fabric-api'
        }
    }
    // NeoForge 官方 maven（只承载 net.neoforged*；正则而非 includeGroup，见上游事故说明）
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
        content {
            includeGroupByRegex 'net\\.neoforged.*'
        }
    }
    // Mojang 官方库（vanilla version json 的 libraries 权威源）：DFU / brigadier 等在这里
    maven {
        name = 'MojangLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    // ① 加载器核心：默认 JitPack 坐标（implementation，2026-10-16 按用户写法）；本地模式用 libs/Brush-*.jar
    //    来源（2026-10-16 起）：默认 JitPack 坐标；-Pbrush.useLocalJars=true 时用 libs/Brush-*.jar
    if (useLocalJars) {
        compileOnly coreJar
    } else {
        implementation "${jitpackGroup}:${jitpackVersion}"
        // 供 --brush-jar= / bootstrap / harness classpath 使用（解析出来的就是缓存里那个 jar）
        brushLoaderCore "${jitpackGroup}:${jitpackVersion}"
        brushLoaderTools "${jitpackGroup}:${jitpackVersion}:tools"
    }

    // ② MC：vanilla jar + 其自带库的坐标（都只用于编译；运行时由游戏提供）
    compileOnly files(vanillaJar.toFile())
    //    DFU：编译 MC 类型时其父接口链需要（Registry 的父接口 Keyable 来自 DFU）
    //    来源：https://libraries.minecraft.net/com/mojang/datafixerupper/9.0.19/  许可：MIT
    compileOnly 'com.mojang:datafixerupper:9.0.19'
    //    brigadier：命令类型
    //    来源：https://libraries.minecraft.net/com/mojang/brigadier/1.3.10/  许可：MIT
    compileOnly 'com.mojang:brigadier:1.3.10'
    //    netty-buffer：FriendlyByteBuf 的父类 ByteBuf
    //    来源：Central io.netty:netty-buffer:4.2.7.Final  许可：Apache-2.0
    compileOnly 'io.netty:netty-buffer:4.2.7.Final'

    // ③ Mixin / MixinExtras 注解（运行时由加载器或宿主提供）
    //    来源：https://maven.fabricmc.net/net/fabricmc/sponge-mixin/0.17.4+mixin.0.8.7/  许可：MIT
    compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    //    来源：https://repo1.maven.org/maven2/io/github/llamalad7/mixinextras-common/0.5.5/  许可：MIT
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'

    // ④ 日志（游戏侧 log4j 由 MC 提供；这里只要 api 接口）
    //    来源：Central org.apache.logging.log4j:log4j-api:2.22.1  许可：Apache-2.0
    compileOnly 'org.apache.logging.log4j:log4j-api:2.22.1'

    // ⑤ NeoForge API —— **只给 S3 载荷转注册桥**用（用户口径：Brush API 可以引用宿主类）
    //    bus：IEventBus / Event
    //    来源：https://maven.neoforged.net/releases/net/neoforged/bus/8.0.5/  许可：LGPL v2.1
    compileOnly 'net.neoforged:bus:8.0.5@jar'
    //    fancymodloader loader：FML 公开 API（@Mod / Dist 等）
    //    来源：https://maven.neoforged.net/releases/net/neoforged/fancymodloader/loader/11.0.15/  许可：LGPL v2.1
    compileOnly 'net.neoforged.fancymodloader:loader:11.0.15@jar'
    //    mergetool:api：Dist 枚举
    //    来源：https://maven.neoforged.net/releases/net/neoforged/mergetool/2.0.7/  许可：LGPL v2.1
    compileOnly 'net.neoforged:mergetool:2.0.7:api@jar'
    //    neoforge 本体（universal jar）：RegisterPayloadHandlersEvent / PayloadRegistrar / IPayloadHandler
    //    形态已实证：NeoForge 安装产物 <cache>/neoforge/install/libraries/net/neoforged/neoforge/26.1.2.114/
    //    官方发布源 https://maven.neoforged.net/releases/net/neoforged/neoforge/26.1.2.114/
    //    许可：**LGPL v2.1**（该 jar 内 META-INF/neoforge.mods.toml 自述，2026-10-15 实读）
    compileOnly files(universalJar)

    // S2 宿主能力桥要编译期见到 Fabric Transfer API（只编译，不进产物；运行时由宿主 fabric-api 提供）。
    // 版本 = S2 harness（FabricHostProfile）实际加载的 fabric-api 0.155.3+26.1.2 里的模块版本（javap/缓存实证）：
    compileOnly 'net.fabricmc.fabric-api:fabric-transfer-api-v1:8.0.6+357ea7334c'
    compileOnly 'net.fabricmc.fabric-api:fabric-api-lookup-api-v1:2.0.12+d5a053b64c'
    compileOnly 'net.fabricmc.fabric-api:fabric-api-base:2.0.3+ece063234c'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 源码与资源统一 UTF-8 —— 与加载器项目同款（2026-10-16 按用户要求对齐）。
// 本项目 javadoc 里有大量中文，不显式指定的话会跟随平台默认编码（中文 Windows 上是 GBK），
// 一旦 daemon 的 -Dfile.encoding 被改就会编出乱码常量 / 乱码 javadoc。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// 源码布局 = **标准 Gradle 布局**（与导出的 Brush 项目一致）：
//   src/main/java/org/abstruck/brush/**                          Java 源码
//   src/main/resources/{brush.mod.json, brush-api.mixins.json}   元数据与 mixin 配置
// 注：上游仓库里库模组的源码树是 brush-api/src 与 brush-api/resources（无 java/ 前缀）；
//     本导出**归一化为标准布局**，因此这里**不需要**自定义 sourceSets。

// ===== 输入校验（2026-10-16）=====
// 用**独立任务**而非 compileJava 的 doFirst：后者在任务 up-to-date 时会被跳过（本仓踩过这个坑）。
// 三类输入缺件都**可读失败**并给出出路 —— 否则报出来的是成片"找不到符号"，让人误以为代码坏了。
tasks.register('verifyInputs') {
    group = 'brush'
    description = 'Fail readably when the loader core jar / vanilla jar / NeoForge universal jar is missing'
    // 2026-10-16（用户要求"构建时自动自举，不要我手动跑 bootstrap"）：编译前自动补齐 MC 客户端 jar。
    // 离线 / CI 想完全自己掌控就传 -Pbrush.autoBootstrap=false —— 那时缺件仍然可读失败。
    if (!project.hasProperty('brush.autoBootstrap') || project.property('brush.autoBootstrap') != 'false') {
        dependsOn 'metadata'
        dependsOn 'installNeoForge'
    }
    doLast {
        if (useLocalJars && coreJar.isEmpty()) {
            throw new GradleException('loader core jar not found -- build it first:'
                    + ' cd "../Brush" ; gradlew.bat jar'
                    + '  then pass -PbrushCoreJar=<path to Brush-<version>.jar>, or drop it into'
                    + ' <this project>/libs/ (the sibling build output ../Brush/build/libs/Brush-*.jar'
                    + ' is discovered automatically)')
        }
        if (!vanillaJar.toFile().isFile()) {
            throw new GradleException('vanilla jar not found: ' + vanillaJar
                    + ' -- run `gradlew.bat bootstrap` (this project carries the loader jar in ./libs'
                    + ' and fetches MC itself),'
                    + ' or pass -Pbrush.vanillaJar=<path to ' + mcVersion + '.jar>')
        }
        if (!universalJar.isFile()) {
            // 这个是**硬需求**：NeoForgePayloadBridge（S3 载荷转注册桥）直接 import
            // net.neoforged.neoforge.network.*，而它们来自 NeoForge 安装产物（下方
            // `compileOnly files(universalJar)`）。缺了它 javac 会报成片"找不到符号"，所以在这里
            // 可读失败并给全三条出路（2026-10-16：曾一度改成提示，但实测证明它确实卡编译）。
            throw new GradleException('NeoForge universal jar not found: ' + universalJar
                    + ' -- run `gradlew.bat bootstrap` (it now runs installNeoForge too), or' +
                    ' `gradlew.bat installNeoForge` alone; offline / unreachable-maven cases:' +
                    ' pass -Pbrush.neoforgeInstaller=<local neoforge-*-installer.jar>, or point' +
                    ' -Pbrush.cache= at a cache that already contains neoforge/install')
        }
    }
}
tasks.named('compileJava') {
    dependsOn 'verifyInputs'
}

// ===== 自举：本项目**自带加载器 jar**（libs/Brush-<版本>.jar），MC 侧自举不依赖任何兄弟项目 =====
// 三个主类住在加载器 jar 里（launch.meta / launch.deps / launch.assets），只依赖 JDK + gson/log4j
// ——所以把本文件夹原封不动拷到别的设备上，bootstrap / jar / runClient 都能跑。
configurations {
    // 自举期（此时还没有 MC jar）：加载器 jar + gson/log4j
    brushBootstrap
    // 运行游戏（S1）：加载器 jar + 注入栈（asm / sponge-mixin / mixinextras）+ gson/log4j
    brushRuntime
}

dependencies {
    brushBootstrap 'com.google.code.gson:gson:2.10.1'
    brushBootstrap 'org.apache.logging.log4j:log4j-api:2.22.1'
    brushBootstrap 'org.apache.logging.log4j:log4j-core:2.22.1'

    brushRuntime 'org.ow2.asm:asm:9.10.1'
    brushRuntime 'org.ow2.asm:asm-commons:9.10.1'
    brushRuntime 'org.ow2.asm:asm-tree:9.10.1'
    brushRuntime 'org.ow2.asm:asm-analysis:9.10.1'
    brushRuntime 'org.ow2.asm:asm-util:9.10.1'
    brushRuntime 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    brushRuntime 'io.github.llamalad7:mixinextras-common:0.5.5'
    brushRuntime 'com.google.code.gson:gson:2.10.1'
    brushRuntime 'org.apache.logging.log4j:log4j-api:2.22.1'
    brushRuntime 'org.apache.logging.log4j:log4j-core:2.22.1'
}

def apiRunDir = file("$projectDir/run")
def siblingLoaderDir = file("$projectDir/../Brush")

tasks.register('metadata', JavaExec) {
    group = 'brush'
    description = 'Fetch Minecraft version metadata and the client jar (sha1 + size checked)'
    classpath = loaderCore + configurations.brushBootstrap
    mainClass = 'org.abstruck.brush.launch.meta.MetadataMain'
    args = [
            '--version=' + mcVersion,
            '--cache=' + cacheDir,
            '--client-jar=' + vanillaJar,
    ]
}

tasks.register('libraries', JavaExec) {
    group = 'brush'
    description = 'Download all applicable Minecraft libraries (incl. natives) and extract natives'
    dependsOn 'metadata'
    classpath = loaderCore + configurations.brushBootstrap
    mainClass = 'org.abstruck.brush.launch.deps.LibrariesMain'
    args = [
            '--version=' + mcVersion,
            '--cache=' + cacheDir,
    ]
}

tasks.register('assets', JavaExec) {
    group = 'brush'
    description = 'Download the Minecraft asset index and all objects into the cache (resumable)'
    dependsOn 'metadata'
    classpath = loaderCore + configurations.brushBootstrap
    mainClass = 'org.abstruck.brush.launch.assets.AssetsMain'
    args = [
            '--version=' + mcVersion,
            '--cache=' + cacheDir,
    ]
}

tasks.register('bootstrap') {
    group = 'brush'
    description = 'Fetch the MC side this project needs (client jar + libraries + natives + assets)'
    dependsOn 'libraries'
    dependsOn 'assets'
    // 2026-10-16：本项目**编译期**要用 NeoForge universal jar（S3 载荷桥 import 了
    // net.neoforged.neoforge.network.*），所以 bootstrap 必须把它一起备好，否则新设备上
    // "bootstrap 完还是编不过"。安装器下载不通时用 -Pbrush.neoforgeInstaller=<本地安装器 jar>。
    dependsOn 'installNeoForge'
    doLast {
        println '[brush-api] bootstrap complete -- client jar: ' + vanillaJar + ' ; cache: ' + cacheDir
        println '[brush-api] (both paths live inside THIS project by default, so the folder is' +
                ' self-contained; to reuse a neighbouring loader project instead, pass' +
                ' -Pbrush.cache=<its cache> -Pbrush.vanillaJar=<its 26.1.2.jar>)'
    }
}

// ===== 宿主 harness（S2/S3 + NeoForge 安装）：用自带的 libs/brush-tools.jar，**不需要兄弟项目** =====
// 该 jar 由加载器项目的 `toolsJar` 任务产出（FabricHostHarness / NeoForgeHostHarness 及其 profile），
// 只依赖加载器本体 jar 的 launch/** 与 gson/log4j。
def toolsCandidates = project.fileTree("$projectDir/libs") { include 'brush-tools*.jar' }.files
def toolsJar = toolsCandidates ? toolsCandidates.sort { it.name }.first() : project.file("$projectDir/libs/brush-tools.jar")
def loaderTools = useLocalJars ? files(toolsJar) : configurations.brushLoaderTools
def harnessClasspath = loaderTools + loaderCore + configurations.brushBootstrap

// 宿主实例里该摆哪些 mod：本项目的 brush-api（外加 -Pbrush.runMods= 指定的项）
def stageHostMods = { java.io.File instanceDir ->
    def modsDir = new File(instanceDir, 'brush-mods')
    modsDir.mkdirs()
    modsDir.listFiles()?.each { f -> if (f.name.endsWith('.jar')) { f.delete() } }
    copy {
        from tasks.jar
        into modsDir
    }
    def staged = [tasks.jar.archiveFile.get().asFile.name]
    if (project.hasProperty('brush.runMods')) {
        (project.property('brush.runMods') as String).split(java.io.File.pathSeparator).each { raw ->
            if (raw == null || raw.trim().isEmpty()) {
                return
            }
            def path = project.file(raw.trim())
            if (path.isDirectory()) {
                path.listFiles()?.findAll { it.isFile() && it.name.endsWith('.jar') }?.sort { it.name }?.each { src ->
                    copy { from src; into modsDir }
                    staged << src.name
                }
            } else if (path.isFile()) {
                copy { from path; into modsDir }
                staged << path.name
            } else {
                throw new GradleException('brush.runMods entry not found: ' + path +
                        ' -- pass a jar file or a directory containing the mod jars to load')
            }
        }
    }
    println '[brush-api] host instance mods (' + modsDir + '): ' + staged.join(', ')
}

// 离线首装：本地已有 NeoForge 安装器 jar 时自动用它（下载缓存 / 兄弟项目缓存里通常都有），
// 免得为了一个 10 MB 的安装器去连可能不通的 maven.neoforged.net。显式 -Pbrush.neoforgeInstaller= 优先。
def findLocalNeoForgeInstaller = {
    if (project.hasProperty('brush.neoforgeInstaller')) {
        return project.file(project.property('brush.neoforgeInstaller'))
    }
    def dirs = [new File(cacheDir.toFile(), 'neoforge'), file("$projectDir/../Brush/cache/neoforge")]
    for (def dir : dirs) {
        if (dir != null && dir.isDirectory()) {
            def hit = (dir.listFiles() ?: new File[0]).findAll { it.isFile() && it.name ==~ /neoforge-.*-installer\.jar/ }.sort { it.name }
            if (!hit.isEmpty()) {
                return hit.first()
            }
        }
    }
    return null
}

tasks.register('installNeoForge', JavaExec) {
    group = 'brush'
    description = 'Install the NeoForge host artifacts into the cache (once, before runNeoForgeClient)'
    classpath = harnessClasspath
    mainClass = 'org.abstruck.brush.tools.NeoForgeHostHarness'
    jvmArgs = ['-Xmx2G']
    workingDir apiRunDir
    doFirst {
        apiRunDir.mkdirs()
        def localInstaller = findLocalNeoForgeInstaller()
        if (localInstaller != null && localInstaller.isFile()) {
            println '[brush-api] installNeoForge: local installer -> ' + localInstaller.absolutePath
        }
        args = [
                '--version=' + mcVersion,
                '--cache=' + cacheDir,
                '--client-jar=' + vanillaJar,
                '--instance=' + new File(apiRunDir, 'neoforge'),
                '--install-only',
        ] + (localInstaller != null && localInstaller.isFile() ? ['--installer-jar=' + localInstaller.absolutePath] : [])
    }
}

tasks.register('runFabricClient', JavaExec) {
    group = 'brush'
    description = 'S2: launch Fabric-hosted MC (Knot + Fabric Loader) with brush-api loaded (self-contained)'
    dependsOn 'bootstrap'
    dependsOn 'jar'
    classpath = harnessClasspath
    mainClass = 'org.abstruck.brush.tools.FabricHostHarness'
    jvmArgs = ['-Xmx2G']
    workingDir apiRunDir
    doFirst {
        apiRunDir.mkdirs()
        def instance = new File(apiRunDir, 'fabric')
        stageHostMods(instance)
        def localLibs = configurations.brushRuntime.resolve().findAll { file ->
            def name = file.name
            name.startsWith('asm-') || name.startsWith('sponge-mixin-') ||
                    name.startsWith('mixinextras-') || name.startsWith('fabric-loader-')
        }.sort { it.name }.collect { it.absolutePath }
        args = [
                '--version=' + mcVersion,
                '--cache=' + cacheDir,
                '--client-jar=' + vanillaJar,
                '--instance=' + instance,
                '--brush-jar=' + coreJarPath(),
                '--inject-libs=' + localLibs.join(File.pathSeparator),
        ]
    }
}

tasks.register('runNeoForgeClient', JavaExec) {
    group = 'brush'
    description = 'S3: launch NeoForge-hosted MC (FML) with brush-api loaded (self-contained)'
    dependsOn 'bootstrap'
    dependsOn 'jar'
    classpath = harnessClasspath
    mainClass = 'org.abstruck.brush.tools.NeoForgeHostHarness'
    jvmArgs = ['-Xmx2G']
    workingDir apiRunDir
    doFirst {
        apiRunDir.mkdirs()
        def instance = new File(apiRunDir, 'neoforge')
        stageHostMods(instance)
        args = [
                '--version=' + mcVersion,
                '--cache=' + cacheDir,
                '--client-jar=' + vanillaJar,
                '--instance=' + instance,
                '--brush-jar=' + coreJarPath(),
        ] + (findLocalNeoForgeInstaller()?.with { it.isFile() ? ['--installer-jar=' + it.absolutePath] : [] } ?: [])
    }
}

tasks.named('jar') {
    archiveFileName = 'brush-api.jar'
    // 产物 = 类 + resources（brush.mod.json / brush-api.mixins.json 等）
    manifest {
        attributes('Implementation-Title': 'Brush API', 'Implementation-Version': project.version)
    }
}

// ===== 运行（2026-10-16：runClient 改为**自包含**，游戏实例落在本项目 run/ 下）=====
// 本项目是**库模组**：测试它就等于"带着 brush-api 跑游戏"。
//   gradlew.bat runClient            S1：纯 Brush + brush-api —— 用本项目的 libs/Brush-<版本>.jar 直接
//                                    启动，MC 资产与运行目录都在本项目内（run/），**不需要兄弟项目**。
//   gradlew.bat runFabricClient      S2：Fabric 宿主 + brush-api —— 拉起宿主需要 harness，
//   gradlew.bat runNeoForgeClient    S3：NeoForge 宿主 + brush-api —— 而 harness 不在加载器 jar 里，
//                                    故这两个仍委托兄弟项目 ../Brush（缺兄弟项目时可读失败）。
tasks.register('runClient', JavaExec) {
    group = 'brush'
    description = 'S1: launch Minecraft through the Brush loader with brush-api loaded (self-contained)'
    dependsOn 'bootstrap'
    dependsOn 'jar'
    classpath = loaderCore + configurations.brushRuntime
    mainClass = 'org.abstruck.brush.launch.Brush'
    jvmArgs = ['-Xmx2G', '--sun-misc-unsafe-memory-access=allow', '--enable-native-access=ALL-UNNAMED']
    workingDir apiRunDir
    doFirst {
        apiRunDir.mkdirs()
        def modsDir = new File(apiRunDir, 'brush-mods')
        modsDir.mkdirs()
        // 运行前重置 mods 目录：摆入**本项目的 brush-api.jar**，外加 -Pbrush.runMods= 指定的 jar/目录
        modsDir.listFiles()?.each { f -> if (f.name.endsWith('.jar')) { f.delete() } }
        copy {
            from tasks.jar
            into modsDir
        }
        def staged = [tasks.jar.archiveFile.get().asFile.name]
        if (project.hasProperty('brush.runMods')) {
            (project.property('brush.runMods') as String).split(java.io.File.pathSeparator).each { raw ->
                if (raw == null || raw.trim().isEmpty()) {
                    return
                }
                def path = project.file(raw.trim())
                if (path.isDirectory()) {
                    path.listFiles()?.findAll { it.isFile() && it.name.endsWith('.jar') }?.sort { it.name }?.each { src ->
                        copy { from src; into modsDir }
                        staged << src.name
                    }
                } else if (path.isFile()) {
                    copy { from path; into modsDir }
                    staged << path.name
                } else {
                    throw new GradleException('brush.runMods entry not found: ' + path +
                            ' -- pass a jar file or a directory containing the mod jars to load')
                }
            }
        }
        // 注入栈顺序敏感：我们自己的条目必须排在最前（sponge-mixin 的 ServiceLoader 扫描按
        // classpath 顺序取第一个 isValid 的服务）。jar 版里"我们的类与资源"就是加载器 jar。
        def injectLibs = [coreJarPath()]
        configurations.brushRuntime.resolve().findAll { file ->
            def name = file.name
            name.startsWith('asm-') || name.startsWith('sponge-mixin-') || name.startsWith('mixinextras-')
        }.sort { it.name }.each { injectLibs.add(it.absolutePath) }
        println '[brush-api] runClient: game dir = ' + apiRunDir + ' ; mods = ' + staged.join(', ')
        args = [
                '--version=' + mcVersion,
                '--cache=' + cacheDir,
                '--game-dir=' + apiRunDir,
                '--client-jar=' + vanillaJar,
                '--inject-libs=' + injectLibs.join(File.pathSeparator),
        ]
    }
}

// S2 / S3 与 NeoForge 安装已在上方改为**自包含**（用自带的 libs/brush-tools.jar 里的 harness），
// 不再需要兄弟项目 —— 2026-10-16 按用户指示：整个文件夹拷到别的设备要能跑全部三个运行时。

// ===== 发布（maven-publish，2026-10-16 按用户要求，与加载器项目同款配置）=====
// 默认只发到**本地目录** build/repo（不碰远程、不需要凭据）；要发远程就显式传属性：
//   -Pbrush.publishUrl=<https://…/repository/…>  [-Pbrush.publishUsername=… -Pbrush.publishPassword=…]
// 坐标：group = org.abstruck.brush（project.group）/ artifactId = brush-api
//       version = gradle.properties 的 apiVersion（project.version 读它，缺省回退 1.0.0）
// 产物：本项目 jar（components.java，即 build/libs/brush-api.jar）+ .pom / .module 与全套校验和。
// 也可以 `gradlew.bat publishToMavenLocal` 装进本机 ~/.m2 供本地联调。
// 与加载器的差别只有两处（有意为之）：artifactId 是 brush-api；没有 tools classifier 那份产物
// （宿主 harness 属于加载器项目，由它发布）。
apply plugin: 'maven-publish'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'brush-api'
            pom {
                name = 'Brush API'
                description = 'Brush API —— Brush 加载器的能力库 mod（三运行时一致的内容注册 / 网络 / 创造栏 / HUD 与输入 / 流体与能量储能）'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License v2.1 or later'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'brushLocal'
            url = project.hasProperty('brush.publishUrl')
                    ? uri(project.property('brush.publishUrl'))
                    : layout.buildDirectory.dir('repo')
            if (project.hasProperty('brush.publishUsername')) {
                credentials {
                    username = project.property('brush.publishUsername')
                    password = project.property('brush.publishPassword')
                }
            }
        }
    }
}
