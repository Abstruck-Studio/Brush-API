// 构建 JDK 不写死（2026-10-16）：toolchain 需要 JDK 25，缺失时由 foojay resolver 自动下载到
// Gradle 缓存。插件源优先阿里云镜像（本机实测可达），再回退官方 portal。
pluginManagement {
    repositories {
        maven {
            name = 'AliyunGradlePlugin'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
    }
}

plugins {
    // 版本查证自 maven-metadata.xml（2026-10-16，latest=release=0.7.0）
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}
// Brush API —— 能力库 mod（独立项目）
rootProject.name = 'BrushAPI'
